# Container Registry
#
# Private Docker v2 container registry

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: registry-auth
  namespace: registry
spec:
  basicAuth:
    secret: registry-auth-secret
---
# CONFIGMAP
apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-config
  namespace: registry
data:
  REGISTRY_STORAGE_DELETE_ENABLED: "true"
---
# DEPLOYMENT
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: registry
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
      - name: registry
        image: registry:2
        ports:
        - name: registry
          containerPort: 5000
          hostPort: 5000
        envFrom:
        - configMapRef:
            name: registry-config
        volumeMounts:
        - name: data
          mountPath: /var/lib/registry
      volumes:
      - name: data
        hostPath:
          path: /mnt/nvme/k8s/data/registry
          type: Directory
---
# SERVICE
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: registry
spec:
  selector:
    app: registry
  ports:
  - name: registry
    port: 5000
    targetPort: registry
  - name: http
    port: 80
    targetPort: registry
---
# INGRESS
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: registry-ingress
  namespace: registry
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: registry-registry-auth@kubernetescrd
spec:
  rules:
  - host: registry.marcodifrancesco.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: registry
            port:
              name: registry
