# Open WebUI
#
# Web interface for LLMs

---
# CONFIGMAP
apiVersion: v1
kind: ConfigMap
metadata:
  name: open-webui-config
  namespace: ai
data:
  PUID: "1000"
  PGID: "1000"
  # GCP Vertex AI service account key
  GOOGLE_APPLICATION_CREDENTIALS: "/gcp-key/ai-agent-498007-e3d4501b37cc.json"
  # Polls automation and timers every 1 hour instead of 1s (CPU was idling at 10-20% instead of <1%)
  TIMER_POLL_INTERVAL: "3600"
---
# DEPLOYMENT
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
      - name: open-webui
        image: ghcr.io/open-webui/open-webui:0.12.3
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: open-webui-config
        - secretRef:
            name: open-webui-secret
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 10 # Total of 115s before recreating
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3 # Total of 45s before recreating
        volumeMounts:
        - name: data
          mountPath: /app/backend/data
        # GCP Vertex AI service account key
        - name: gcp-key
          mountPath: /gcp-key
          readOnly: true
      volumes:
      - name: data
        hostPath:
          path: /mnt/nvme/k8s/data/ai/open-webui/data
          type: Directory
      - name: gcp-key
        hostPath:
          path: /mnt/nvme/k8s/data/ai/open-webui/gcp-key
          type: Directory
---
# SERVICE
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: ai
spec:
  selector:
    app: open-webui
  ports:
  - name: http
    port: 80
    targetPort: http
---
# INGRESS
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-webui-ingress
  namespace: ai
spec:
  rules:
  - host: ai.marcodifrancesco.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: open-webui
            port:
              name: http
