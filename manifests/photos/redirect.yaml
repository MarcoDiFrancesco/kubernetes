# Redirect
#
# Redirect immich.marcodifrancesco.com to photos.marcodifrancesco.com

---
# MIDDLEWARE
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-photos
  namespace: photos
spec:
  redirectRegex:
    regex: "^https?://immich\\.marcodifrancesco\\.com/(.*)"
    replacement: "https://photos.marcodifrancesco.com/${1}"
    permanent: true
---
# INGRESS
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich-redirect-ingress
  namespace: photos
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: photos-redirect-to-photos@kubernetescrd
spec:
  rules:
  - host: immich.marcodifrancesco.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: immich-server
            port:
              name: http
