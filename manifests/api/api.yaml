# API
#
# Investments (Yahoo Finance) and Accounting (Cashew SQLite ETL) service

---
# DEPLOYMENT
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: localhost:30500/api:latest
        imagePullPolicy: Always
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - name: http
          containerPort: 54246
        command: ["fastapi", "run", "app.py", "--port", "54246"]
        envFrom:
        - secretRef:
            name: api-secret
        volumeMounts:
        - name: investments # Yahoo Finance SQLite database
          mountPath: /app/data/investments
        - name: accounting # Cashew raw/processed SQLite storage
          mountPath: /app/data/accounting
      volumes:
      - name: investments
        hostPath:
          path: /mnt/nvme/k8s/data/api/investments
          type: Directory
      - name: accounting
        hostPath:
          path: /mnt/nvme/k8s/data/api/accounting
          type: Directory
---
# SERVICE
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: api
spec:
  selector:
    app: api
  ports:
  - name: http
    port: 80
    targetPort: http
---
# MIDDLEWARE (Strip /api prefix)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api-prefix
  namespace: api
spec:
  stripPrefix:
    prefixes:
      - /api
---
# INGRESS
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  namespace: api
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: api-strip-api-prefix@kubernetescrd
spec:
  rules:
  - host: api.marcodifrancesco.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              name: http
  - host: finance.marcodifrancesco.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              name: http
