# Cloudflare Tunnel
#
# Connects Cloudflare edge network to Traefik ingress controller in cluster

---
# DEPLOYMENT
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: kube-system
  labels:
    app.kubernetes.io/name: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
    spec:
      priorityClassName: system-cluster-critical
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:2026.9.3
        args:
        - tunnel
        - --no-autoupdate
        - --metrics
        - 0.0.0.0:2000
        - run
        envFrom:
        - secretRef:
            name: cloudflare-tunnel-token
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /ready
            port: 2000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 2000
          initialDelaySeconds: 5
          periodSeconds: 5
        ports:
        - name: metrics
          containerPort: 2000
