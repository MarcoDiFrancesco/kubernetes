# Pod Restarter
#
# Restarts target deployments daily at 02:00 UTC
# - refreshes provider endpoints
# - mitigates long-running memory leaks

---
# SERVICEACCOUNT
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-restarter
  namespace: kube-system
---
# CLUSTERROLE
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-restarter
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "patch"]
---
# CLUSTERROLEBINDING
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-restarter
subjects:
- kind: ServiceAccount
  name: pod-restarter
  namespace: kube-system
roleRef:
  kind: ClusterRole
  name: pod-restarter
  apiGroup: rbac.authorization.k8s.io
---
# CRONJOB
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pod-restarter
  namespace: kube-system
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0 # Do not retry
      template:
        spec:
          serviceAccountName: pod-restarter
          restartPolicy: Never
          containers:
          - name: pod-restarter
            image: bitnami/kubectl:latest
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 128Mi
            command:
            - /bin/sh
            - -c
            - |
              rc=0
              kubectl rollout restart deployment/litellm -n litellm || rc=1
              sleep 300
              kubectl rollout restart deployment/open-webui -n ai || rc=1
              exit "$rc"
