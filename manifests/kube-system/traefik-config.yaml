# Traefik Helm Configuration
#
# - Uses ClusterIP instead of LoadBalancer (avoids exposing ports 80 and 443 to local network)
# - Increases probe timeout (5s instead of default 2s) to prevent restarts during CPU spikes

---
# HELMCHARTCONFIG
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      spec:
        type: ClusterIP
    readinessProbe:
      timeoutSeconds: 5
      failureThreshold: 3 # Mark as "Not Ready" after 30s -> Stops sending traffic
    livenessProbe:
      timeoutSeconds: 5
      failureThreshold: 5 # Mark as "Unhealthy" after 50s -> Restarts pod
