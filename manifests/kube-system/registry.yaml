# Container Registry
#
# Private Docker v2 container registry (NodePort via localhost:30500)
#
# Build & push example:
#   docker build -t localhost:30500/<image>:latest .
#   docker push localhost:30500/<image>:latest
#   kubectl rollout restart deployment/<name> -n <namespace>

---
# CONFIGMAP
apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-config
  namespace: kube-system
data:
  REGISTRY_STORAGE_DELETE_ENABLED: "true"
---
# DEPLOYMENT
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: kube-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
      - name: registry
        image: registry:2
        ports:
        - name: registry
          containerPort: 5000
        envFrom:
        - configMapRef:
            name: registry-config
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "2"
            memory: 2Gi
        volumeMounts:
        - name: data
          mountPath: /var/lib/registry
      volumes:
      - name: data
        hostPath:
          path: /mnt/nvme/k8s/data/kube-system/registry
          type: Directory
---
# SERVICE
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: kube-system
spec:
  type: NodePort
  selector:
    app: registry
  ports:
  - name: registry
    port: 30500
    targetPort: registry
    nodePort: 30500
