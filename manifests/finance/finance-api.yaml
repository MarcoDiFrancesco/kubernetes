# Finance API
#
# Financial data API from Yahoo Finance

---
# MIDDLEWARE (Strip /api prefix)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api-prefix
  namespace: finance
spec:
  stripPrefix:
    prefixes:
      - /api
---
# DEPLOYMENT
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-api
  namespace: finance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finance-api
  template:
    metadata:
      labels:
        app: finance-api
    spec:
      containers:
      - name: finance-api
        image: localhost:5000/finance-api:latest
        imagePullPolicy: Always
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - name: http
          containerPort: 54246
        command: ["fastapi", "run", "app.py", "--port", "54246"]
        volumeMounts:
        - name: db
          mountPath: /app/db
      volumes:
      - name: db
        hostPath:
          path: /mnt/nvme/k8s/data/finance/db
          type: Directory
---
# SERVICE
apiVersion: v1
kind: Service
metadata:
  name: finance-api
  namespace: finance
spec:
  selector:
    app: finance-api
  ports:
  - name: http
    port: 80
    targetPort: http
---
# INGRESS
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finance-api-ingress
  namespace: finance
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: finance-strip-api-prefix@kubernetescrd
spec:
  rules:
  - host: finance.marcodifrancesco.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: finance-api
            port:
              name: http
