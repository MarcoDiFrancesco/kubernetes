# Redirect
#
# Redirect grafana.marcodifrancesco.com to dashboard.marcodifrancesco.com

---
# MIDDLEWARE
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-dashboard
  namespace: monitoring
spec:
  redirectRegex:
    regex: "^https?://grafana\\.marcodifrancesco\\.com/(.*)"
    replacement: "https://dashboard.marcodifrancesco.com/${1}"
    permanent: true
---
# INGRESS
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-redirect-ingress
  namespace: monitoring
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: monitoring-redirect-to-dashboard@kubernetescrd
spec:
  rules:
  - host: grafana.marcodifrancesco.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              name: http
