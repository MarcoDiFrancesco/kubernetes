# FlareSolverr
# 
# Used by Prowlarr to solve Cloudflare capchas.

---
# CONFIGMAP
apiVersion: v1
kind: ConfigMap
metadata:
  name: flaresolverr-config
  namespace: torrent
data:
  LOG_LEVEL: "info"
---
# DEPLOYMENT
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaresolverr
  namespace: torrent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flaresolverr
  template:
    metadata:
      labels:
        app: flaresolverr
    spec:
      containers:
      - name: flaresolverr
        image: flaresolverr/flaresolverr:latest
        ports:
        - name: http
          containerPort: 8191
        envFrom:
        - configMapRef:
            name: flaresolverr-config
---
# SERVICE
apiVersion: v1
kind: Service
metadata:
  name: flaresolverr
  namespace: torrent
spec:
  selector:
    app: flaresolverr
  ports:
  - name: http
    port: 80
    targetPort: http
